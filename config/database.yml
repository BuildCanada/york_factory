# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgis
  encoding: unicode
  schema_search_path: "public,warehouse"
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# fact-factory's `api` read model (docs/public-interface-design.md §5.3): the
# allowlisted schema the public data API (/v1) serves. Read-only: Rails never
# migrates, writes to or dumps it (database_tasks: false), and every
# transaction is read-only with a 5 s statement timeout, as the api_reader role
# enforces in production. In production and staging the URL comes from
# FACT_FACTORY_API_DATABASE_URL (api_reader on a replica, port 5432, never the
# PgBouncer port). No credentials are kept here.
fact_factory_api: &fact_factory_api
  adapter: postgresql
  encoding: unicode
  database_tasks: false
  replica: true
  schema_search_path: api
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  variables:
    default_transaction_read_only: "on"
    statement_timeout: <%= ENV.fetch("FACT_FACTORY_API_STATEMENT_TIMEOUT", "5s") %>

development:
  primary:
    <<: *default
    database: york_factory_development<%= "_#{ENV['CONDUCTOR_WORKSPACE_NAME']}" if ENV['CONDUCTOR_WORKSPACE_NAME'] %>
  queue:
    <<: *default
    database: york_factory_development_queue<%= "_#{ENV['CONDUCTOR_WORKSPACE_NAME']}" if ENV['CONDUCTOR_WORKSPACE_NAME'] %>
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: york_factory_development_cache<%= "_#{ENV['CONDUCTOR_WORKSPACE_NAME']}" if ENV['CONDUCTOR_WORKSPACE_NAME'] %>
    migrations_paths: db/cache_migrate
  # A local fact-factory database with a built read model
  # (`fact-factory api build`), or FACT_FACTORY_API_DATABASE_URL.
  fact_factory_api:
    <<: *fact_factory_api
    database: fact_factory
    url: <%= ENV["FACT_FACTORY_API_DATABASE_URL"] %>

  # The specified database role being used to connect to PostgreSQL.
  # To create additional roles in PostgreSQL see `$ createuser --help`.
  # When left blank, PostgreSQL will use the default role. This is
  # the same name as the operating system user running Rails.
  #username: york_factory

  # The password associated with the PostgreSQL role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary: &primary_test
    <<: *default
    database: york_factory_test<%= "_#{ENV['CONDUCTOR_WORKSPACE_NAME']}" if ENV['CONDUCTOR_WORKSPACE_NAME'] %>
    url: <%= ENV["DATABASE_URL"] %>
  queue:
    <<: *primary_test
    database: york_factory_test_queue<%= "_#{ENV['CONDUCTOR_WORKSPACE_NAME']}" if ENV['CONDUCTOR_WORKSPACE_NAME'] %>
    migrations_paths: db/queue_migrate
  cache:
    <<: *primary_test
    database: york_factory_test_cache<%= "_#{ENV['CONDUCTOR_WORKSPACE_NAME']}" if ENV['CONDUCTOR_WORKSPACE_NAME'] %>
    migrations_paths: db/cache_migrate
  # Created and loaded by the test suite itself, from fact-factory's
  # api_schema.sql and the fixture rows in test/support/fact_factory_api
  # (see test/support/fact_factory_api_database.rb). One database is shared
  # by every parallel worker; tests only read it.
  fact_factory_api:
    <<: *fact_factory_api
    database: york_factory_test_fact_factory_api<%= "_#{ENV['CONDUCTOR_WORKSPACE_NAME']}" if ENV['CONDUCTOR_WORKSPACE_NAME'] %>
    url: <%= ENV["DATABASE_URL"] %>

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Connection URLs for non-primary databases can also be configured using
# environment variables. The variable name is formed by concatenating the
# connection name with `_DATABASE_URL`. For example:
#
#   CACHE_DATABASE_URL="postgres://cacheuser:cachepass@localhost/cachedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
production:
  primary: &primary_production
    <<: *default
    username: <%= Rails.application.credentials.database&.fetch(:username) %>
    password: <%= Rails.application.credentials.database&.fetch(:password) %>
    database: york_factory
    host: <%= Rails.application.credentials.database&.fetch(:host) %>
    port: <%= Rails.application.credentials.database&.fetch(:port) %>
    sslmode: require
  cache:
    <<: *primary_production
    database: york_factory_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: york_factory_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: york_factory_cable
    migrations_paths: db/cable_migrate
  fact_factory_api:
    <<: *fact_factory_api
    url: <%= ENV["FACT_FACTORY_API_DATABASE_URL"] %>
