# York Factory — Canadian fiscal data pipeline
service: york_factory
image: buildcanada/york_factory

ssh:
  user: ubuntu

servers:
  web:
    hosts:
      - 66.70.179.6
  worker:
    hosts:
      - 66.70.179.6
    cmd: bin/jobs

proxy:
  ssl: true
  host: york-factory.eng.canadasbuilding.com

registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - ANTHROPIC_API_KEY
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_ENDPOINT
    - R2_BUCKET
    - R2_ACTIVE_STORAGE_BUCKET
  clear:
    SOLID_QUEUE_IN_PUMA: false
    RAILS_LOG_LEVEL: info
    CORS_ORIGINS: "https://buildcanada.com,https://york-factory.eng.canadasbuilding.com"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "york_factory_storage:/rails/storage"

builder:
  arch: amd64
