# York Factory — Canadian fiscal data pipeline
service: york_factory
image: buildcanada/york_factory

ssh:
  user: ubuntu

servers:
  web:
    hosts:
      - 66.70.179.6
  worker:
    hosts:
      - 66.70.179.6
    cmd: bin/jobs

# The web entrypoint runs db:prepare. Boot it before the worker so the worker
# cannot start against an unmigrated schema.
boot:
  parallel_roles: false

proxy:
  ssl:
    certificate_pem: CERTIFICATE_PEM
    private_key_pem: PRIVATE_KEY_PEM
  # auth.buildcanada.com serves the Doorkeeper OAuth endpoints (/oauth/*) used by
  # TradingPost for draft preview. Both hosts route to the same Rails app; the
  # supplied TLS cert must cover both names (SAN or *.buildcanada.com wildcard).
  hosts:
    - yorkfactory.buildcanada.com
    - auth.buildcanada.com

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") { `bin/rails credentials:fetch kamal.registry_username`.strip } %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - ANTHROPIC_API_KEY
    - TURBOPUFFER_API_KEY
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_ENDPOINT
    - R2_BUCKET
    - R2_ACTIVE_STORAGE_BUCKET
  clear:
    SOLID_QUEUE_IN_PUMA: false
    RAILS_LOG_LEVEL: info
    CORS_ORIGINS: "https://www.buildcanada.com,https://buildcanada.com,https://yorkfactory.buildcanada.com"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "york_factory_storage:/rails/storage"

builder:
  arch: amd64
