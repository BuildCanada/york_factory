default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # All jobs use this single default queue; do not add dedicated queues or workers.
    - queues: default
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
