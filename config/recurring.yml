# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  backfill_feed:
    class: BackfillFeedJob
    schedule: every hour at minute 0
  scrape_zernio_social_media:
    class: Metrics::ScrapeZernioSocialMediaJob
    schedule: every hour at minute 15
  sync_meta_analytics:
    class: Metrics::SyncMetaAnalyticsJob
    schedule: every day at 6:30am
  create_instagram_weeks:
    class: CreateInstagramWeeksJob
    schedule: at 6am every Monday
  fetch_economy_sources:
    # Daily poll of economy dashboard sources; the job fetches each source
    # only when its own fetch_frequency interval has elapsed.
    class: Warehouse::FetchEconomySourcesJob
    schedule: every day at 7am
  fetch_spending_sources:
    class: Warehouse::FetchSpendingSourcesJob
    schedule: every day at 7:30am
  hubspot_bulk_sync_recent:
    # command form: recurring args: hashes arrive with string keys, which the
    # job's **options kwargs would silently drop.
    command: "HubspotBulkSyncJob.perform_later(:recent, hours: 26)"
    schedule: every day at 1am
  hubspot_bulk_sync_all:
    class: HubspotBulkSyncJob
    args: [ all ]
    schedule: at 3am every Sunday
  luma_event_sync:
    class: LumaEventSyncJob
    schedule: every day at 6am
  luma_daily_guest_sync:
    class: LumaDailyGuestSyncJob
    schedule: every day at 8am
  fetch_election_sources:
    # Nightly poll of election candidate sources (Toronto's feeds, Brampton's
    # scraped candidate page); unchanged data dedupes on checksum and is a
    # no-op. Runs at midnight so each day starts on the prior day's filings.
    class: Warehouse::FetchElectionSourcesJob
    schedule: every day at 12am
  search_dispatch_media_feeds:
    class: Search::Media::DispatchDueFeedsJob
    schedule: every minute
  search_saved_search_fanout:
    class: Search::SavedSearchFanoutJob
    schedule: every minute
