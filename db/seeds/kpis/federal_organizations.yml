  - { slug: "crown-indigenous-relations-and-northern-affairs", canonical_name: "Crown-Indigenous Relations and Northern Affairs Canada", kind: "department", aliases: [ "CIRNAC" ] }

  # --- Justice / security / defence ---
  - { slug: "department-of-justice",            canonical_name: "Department of Justice Canada", kind: "department", aliases: [ "Justice Canada", "DOJ" ] }
  - { slug: "public-safety-canada",             canonical_name: "Public Safety Canada", kind: "department", aliases: [ "PS Canada" ] }
  - { slug: "royal-canadian-mounted-police",    canonical_name: "Royal Canadian Mounted Police", kind: "agency", aliases: [ "RCMP" ] }
