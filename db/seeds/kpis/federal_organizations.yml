  - { slug: "innovation-science-and-economic-development-canada",     canonical_name: "Innovation, Science and Economic Development Canada", kind: "department", aliases: [ "ISED", "Industry Canada" ] }
  - { slug: "employment-and-social-development-canada",               canonical_name: "Employment and Social Development Canada", kind: "department", aliases: [ "ESDC", "HRSDC", "Human Resources and Skills Development Canada", "Service Canada" ] }
  - { slug: "public-services-and-procurement-canada",                 canonical_name: "Public Services and Procurement Canada", kind: "department", aliases: [ "PSPC", "Public Works and Government Services Canada", "PWGSC" ] }
  - { slug: "statistics-canada",                                      canonical_name: "Statistics Canada", kind: "agency", aliases: [ "StatCan" ] }
  - { slug: "office-of-the-superintendent-of-financial-institutions", canonical_name: "Office of the Superintendent of Financial Institutions", kind: "agency", aliases: [ "OSFI" ] }
  - { slug: "fintrac",                                                canonical_name: "Financial Transactions and Reports Analysis Centre of Canada", kind: "agency", aliases: [ "FINTRAC" ] }

  # --- Health / social ---
