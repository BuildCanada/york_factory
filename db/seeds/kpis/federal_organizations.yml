  - { slug: "library-and-archives-canada",  canonical_name: "Library and Archives Canada", kind: "agency", aliases: [ "LAC" ] }
  - { slug: "national-research-council",    canonical_name: "National Research Council Canada", kind: "agency", aliases: [ "NRC" ] }
