# Federal Government of Canada organizations (departments, agencies, crown corps).
#
# This is a starter list of the most commonly-cited departments and acronyms,
# not the full TBS roster of ~200 entities. The `extract-kpis` skill lazily
# creates orgs via POST /api/v1/kpis/admin/organizations on miss, so anything
# not pre-seeded here is auto-created on first encounter.
#
# When adding a row by hand: pick a slug that's stable (matches the URL slug
# on canada.ca where possible), use the public business name from TBS InfoBase
# as canonical_name, and put all known acronyms / "Department of …" variants
# in aliases.

organizations:
  # --- Treasury & central agencies ---
  - { slug: "treasury-board-of-canada-secretariat", canonical_name: "Treasury Board of Canada Secretariat", kind: "department", aliases: [ "TBS", "Treasury Board Secretariat" ] }
  - { slug: "department-of-finance",                canonical_name: "Department of Finance Canada", kind: "department", aliases: [ "Finance Canada", "Department of Finance" ] }
  - { slug: "privy-council-office",                 canonical_name: "Privy Council Office", kind: "department", aliases: [ "PCO" ] }
  - { slug: "public-service-commission",            canonical_name: "Public Service Commission of Canada", kind: "department", aliases: [ "PSC" ] }
  - { slug: "canada-school-of-public-service",      canonical_name: "Canada School of Public Service", kind: "agency", aliases: [ "CSPS" ] }
  - { slug: "office-of-the-auditor-general-canada", canonical_name: "Office of the Auditor General of Canada", kind: "agency", aliases: [ "OAG", "Auditor General of Canada" ] }

  # --- Economic / fiscal ---
