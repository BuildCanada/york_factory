title: EntityListResponse
description: "A page of entities. The standard list envelope: items in `data`, the cursor for the next page in `meta.next_cursor` and `links.next`."
type: object
required: [data, meta, links]
properties:
  data:
    type: array
    description: A page of entities.
    items:
      anyOf:
      - $ref: Entity.yaml
      - $ref: EntityFields.yaml
  meta:
    $ref: ListMeta.yaml
    description: The revision that answered, the resolved as_of, the request ID, caveats and pagination.
  links:
    $ref: PageLinks.yaml
    description: Links for this page and the next.
