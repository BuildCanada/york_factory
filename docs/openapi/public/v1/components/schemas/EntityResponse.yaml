title: EntityResponse
description: "One entity. The standard envelope: the object in `data`, facts about the response in `meta`, and a pinned `self` link."
type: object
required: [data, meta, links]
properties:
  data:
    description: One entity; with `fields=`, only the fields requested.
    anyOf:
    - $ref: Entity.yaml
    - $ref: EntityFields.yaml
  meta:
    $ref: Meta.yaml
    description: The revision that answered, the resolved as_of, the request ID and caveats.
  links:
    $ref: Links.yaml
    description: Links for the response.
