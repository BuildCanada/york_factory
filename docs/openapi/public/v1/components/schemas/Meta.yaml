title: Meta
description: >-
  Facts about the response itself: which release answered, how `as_of` was resolved, the
  request ID to quote in support requests, and caveats that apply to the whole response.
type: object
required: [release, as_of, request_id, caveats]
properties:
  release:
    description: >-
      The registry release that answered, or null for data versioned only by time.
      Pass it back as `as_of` to get the same bytes again.
    oneOf:
      - $ref: ReleaseNumber.yaml
      - type: 'null'
  as_of:
    type: string
    description: >-
      How the request's `as_of` was resolved, as the release number it pinned (for
      example "11"), or the timestamp it was evaluated at for time-versioned data.
      Omitting `as_of` resolves to the latest release, named here.
    examples: ['11']
  request_id:
    type: string
    pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
    description: Identifier of this request. Problem responses repeat it as `instance`.
    examples: [req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C]
  caveats:
    type: array
    description: Caveats that apply to this response. Empty when there are none; never omitted.
    items:
      $ref: Caveat.yaml
