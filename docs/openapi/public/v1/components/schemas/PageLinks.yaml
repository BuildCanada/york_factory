title: PageLinks
description: Links for a page of results.
type: object
required: [self, next]
properties:
  self:
    type: string
    description: A relative URL for this page, with `as_of` pinned.
    examples: ['/v1/entities?class=government_org&as_of=31']
  next:
    type: [string, 'null']
    description: A relative URL for the next page, or null on the last page.
    examples: ['/v1/entities?class=government_org&as_of=31&cursor=c1.eyJyIjoxMSwiayI6IjAxSjlaSzRUNk04UTJSNVY3WDNCMU4wQzREIn0.Jq3v']
