title: ReleaseChange
description: One changelog entry of a release.
type: object
required: [kind, summary]
properties:
  kind:
    type: string
    description: The kind of change, such as entities_added, entities_redirected, rule_activated, source_refreshed or person_corrections.
    examples: [entities_added]
  summary:
    type: string
    description: The change in plain words.
    examples: ['1,204 entities created from unlinked recipients (create-v4).']
  count:
    type: [integer, 'null']
    minimum: 0
    description: The number of rows the change affected, when countable.
    examples: [1204]
