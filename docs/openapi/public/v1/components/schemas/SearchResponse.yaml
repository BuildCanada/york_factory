title: SearchResponse
description: "A page of search results, best match first. The standard list envelope: items in `data`, the cursor for the next page in `meta.next_cursor` and `links.next`."
type: object
required: [data, meta, links]
properties:
  data:
    type: array
    description: A page of search results, best match first.
    items:
      $ref: SearchHit.yaml
  meta:
    $ref: ListMeta.yaml
    description: The revision that answered, the resolved as_of, the request ID, caveats and pagination.
  links:
    $ref: PageLinks.yaml
    description: Links for this page and the next.
