components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: bc_live_<secret>_<crc6>
      description: >-
        An API key from https://auth.buildcanada.com/developers, sent as
        `Authorization: Bearer bc_live_…` (`bc_stg_…` on staging). A key carries the
        scopes its owner granted it (read:public always; usage:read by default). Keys are shown once; the console shows only the first 12
        characters.
    OAuth2:
      type: oauth2
      description: >-
        OAuth 2.1 authorization code flow with PKCE (S256 only; `plain` is refused) and
        RFC 8707 resource indicators: send `resource=https://data.buildcanada.com/mcp` or
        `https://data.buildcanada.com/v1`. Clients register by Client ID Metadata Document
        (preferred) or dynamic client registration at
        https://auth.buildcanada.com/oauth/register. Access tokens last one hour; refresh
        tokens rotate. Metadata: https://auth.buildcanada.com/.well-known/oauth-authorization-server.
      x-bc-pkce: S256
      x-bc-resource-indicators: true
      flows:
        authorizationCode:
          authorizationUrl: https://auth.buildcanada.com/oauth/authorize
          tokenUrl: https://auth.buildcanada.com/oauth/token
          refreshUrl: https://auth.buildcanada.com/oauth/token
          scopes:
            'read:public': Read organizations, persons, spending, releases, datasets, the dictionary and exports.
            'usage:read': Read your account's usage (/v1/me/usage).
            'keys:manage': Create, rotate and revoke API keys (phase 2; OAuth tokens only, never API keys).
  schemas:
    Problem:
      $ref: components/schemas/Problem.yaml
    Meta:
      $ref: components/schemas/Meta.yaml
    ListMeta:
      $ref: components/schemas/ListMeta.yaml
    Caveat:
      $ref: components/schemas/Caveat.yaml
    Provenance:
      $ref: components/schemas/Provenance.yaml
    Entity:
      $ref: components/schemas/Entity.yaml
    SpendingRecord:
      $ref: components/schemas/SpendingRecord.yaml
