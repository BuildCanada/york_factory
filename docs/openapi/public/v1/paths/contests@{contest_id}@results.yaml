# /contests/{contest_id}/results
get:
  operationId: listContestResults
  summary: List a contest's results
  description: |-
    The counts of one contest in one result report: the latest report by default, or the one
    `report` names. Rows are in result-ID order, as fact-factory recorded them.
  tags:
  - Elections
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name:
  - contests
  - results
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: short
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: contest_id
    in: path
    required: true
    description: "The contest's ID. Percent-encode it in the path."
    schema: {"$ref": "../components/schemas/ElectionId.yaml"}
    example: "ca/bc/elections/2024-10-19-general/mla/abm"
  - name: report
    in: query
    required: false
    description: "The result report to read (its ID). Default: the election's latest report."
    schema: {"type": "string", "pattern": "^[0-9A-Z]{26}$"}
    example: "01M3TP69B6TM9F579VB93ZHFNE"
  - name: measure
    in: query
    required: false
    description: "Only counts of this measure, such as votes."
    schema: {"type": "string", "pattern": "^[a-z_]+$"}
    example: "votes"
  - name: polling_area
    in: query
    required: false
    description: "Only counts for this polling area (its ID)."
    schema: {"$ref": "../components/schemas/ElectionId.yaml"}
    example: "ca/bc/voting-areas/2024-09-19/abm/1"
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: List a contest's results.
      headers:
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/ElectionResultListResponse.yaml"
          examples:
            results:
              summary: Advance votes for a candidate
              value:
                data:
                - report_id: 01M3TP69B6TM9F579VB93ZHFNE
                  contest_id: ca/bc/elections/2024-10-19-general/mla/abm
                  candidacy_id: 01M3TP5P62RM2298Y7AC2WYJJ4
                  answer: null
                  measure: votes
                  measure_as_shown: null
                  polling_area_id: null
                  unit_label_as_shown: null
                  ballot_type: advance
                  ballot_type_as_shown: null
                  round: 1
                  value: 1894
                  reported_under: null
                meta:
                  revision: null
                  snapshot: null
                  as_of: '2026-10-01T03:00:00Z'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                  limit: 50
                  next_cursor: null
                  count: null
                links:
                  self: /v1/contests/ca%2Fbc%2Felections%2F2024-10-19-general%2Fmla%2Fabm/results
                  next: null
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '403':
      "$ref": "../components/problems.yaml#/Forbidden"
    '404':
      "$ref": "../components/problems.yaml#/NotFound"
    '409':
      "$ref": "../components/problems.yaml#/Conflict"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
