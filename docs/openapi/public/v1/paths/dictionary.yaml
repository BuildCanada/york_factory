# /dictionary
get:
  operationId: listDictionaryTerms
  summary: List data dictionary terms
  description: |-
    The shared data dictionary: one definition per concept, reused by every dataset. Each
    data field in this API names its term in `x-bc-dictionary`. Per-asset notes are on
    /dictionary/{term}.
  tags:
  - Dictionary
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name: dictionary
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: short
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: q
    in: query
    required: false
    description: Only terms whose name or meaning contains this text.
    schema:
      type: string
      minLength: 2
    example: fiscal
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of terms.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Revision:
          "$ref": "../components/headers.yaml#/BCRevision"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/DictionaryTermListResponse.yaml"
          examples:
            terms:
              summary: Terms
              value:
                data:
                - term: record_type
                  meaning: The kind of financial record.
                  type: string
                  units:
                  values:
                  - value: contract
                    meaning: A procurement contract or aggregated contract total.
                  - value: grant
                    meaning: A grant agreement.
                  blank_means: Never blank.
                  known_gaps:
                  links:
                    self: "/v1/dictionary/record_type"
                    docs: https://data.buildcanada.com/api/dictionary/record_type
                meta:
                  revision: 31
                  snapshot:
                  as_of: '31'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                  limit: 50
                  next_cursor:
                  count:
                links:
                  self: "/v1/dictionary?as_of=31"
                  next:
    '304':
      "$ref": "../components/responses.yaml#/NotModified"
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '403':
      "$ref": "../components/problems.yaml#/Forbidden"
    '404':
      "$ref": "../components/problems.yaml#/NotFound"
    '409':
      "$ref": "../components/problems.yaml#/Conflict"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
