# /elections/{election_id}
get:
  operationId: getElection
  summary: Get an election
  description: |-
    One election, with its key dates, voting rules and the capture its details came from.
  tags:
  - Elections
  x-fern-sdk-method-name: get
  x-fern-sdk-group-name: elections
  x-bc-phase: 1
  x-bc-units:
    base: 1
  x-bc-scopes:
  - read:public
  x-bc-cache: short
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: election_id
    in: path
    required: true
    description: "The election's ID. Percent-encode it in the path."
    schema: {"$ref": "../components/schemas/ElectionId.yaml"}
    example: "ca/bc/elections/2024-10-19-general"
  responses:
    '200':
      description: Get an election.
      headers:
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        RateLimit:
