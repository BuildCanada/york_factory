# /entities
get:
  operationId: listEntities
  summary: List entities
  description: |-
    Entities of the registry, filtered by class, subtype, jurisdiction, status and the
    date they were valid on. To find an entity by name or identifier use /search; this
    operation lists, it does not match names.
  tags:
  - Entities
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name: entities
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
    count_exact: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: revision
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: class
    in: query
    required: false
    description: Only entities of this class.
    schema:
      "$ref": "../components/schemas/EntityClass.yaml"
    example: government_org
  - name: subtype
    in: query
    required: false
    description: Only entities of this subtype, such as municipal_government.
    schema:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    example: municipal_government
  - name: jurisdiction
    in: query
    required: false
    description: Only entities of this jurisdiction.
    schema:
      "$ref": "../components/schemas/Jurisdiction.yaml"
    example: ca-ab
  - name: status
    in: query
    required: false
    description: Only entities with this roster status, such as active or dissolved.
    schema:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    example: active
  - "$ref": "../components/parameters.yaml#/ValidOn"
  - name: sort
    in: query
    required: false
    description: Sort order. `id` (default, stable) or `name`.
    schema:
      type: string
      enum:
      - id
      - name
      default: id
    example: name
  - "$ref": "../components/parameters.yaml#/Fields"
  - "$ref": "../components/parameters.yaml#/Count"
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of entities.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Revision:
          "$ref": "../components/headers.yaml#/BCRevision"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/EntityListResponse.yaml"
