# /entities/{id}
get:
  operationId: getEntity
  summary: Get an entity
  description: |-
    One entity as of the release that answered, with provenance and a ready-to-paste
    citation. `expand=identifiers,relationships` embeds them. A merged duplicate returns
    301 to its survivor, so old IDs keep working; an entity ended by lineage returns 200
    with valid_to set.
  tags:
  - Entities
  x-fern-sdk-method-name: get
  x-fern-sdk-group-name: entities
  x-bc-phase: 1
  x-bc-units:
    base: 1
  x-bc-scopes:
  - read:public
  x-bc-cache: release
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - "$ref": "../components/parameters.yaml#/EntityId"
  - name: expand
    in: query
    required: false
    description: 'Embed related objects, comma-separated: `identifiers`, `relationships` (first 50 outgoing).'
    schema:
      type: array
      items:
        type: string
        enum:
        - identifiers
        - relationships
    example:
    - identifiers
    style: form
    explode: false
  - "$ref": "../components/parameters.yaml#/Fields"
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  responses:
    '200':
      description: The entity.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Release:
          "$ref": "../components/headers.yaml#/BCRelease"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/EntityResponse.yaml"
          examples:
            with_identifiers:
              summary: Diamond Valley with identifiers
              value:
                data:
                  id: gid://buildcanada/Entity/01J9ZK4T6M8Q2R5V7X3B1N0C4D
                  entity_class: government_org
