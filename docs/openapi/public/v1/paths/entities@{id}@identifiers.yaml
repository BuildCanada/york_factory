# /entities/{id}/identifiers
get:
  operationId: listEntityIdentifiers
  summary: List an entity's identifiers
  description: |-
    The external identifiers the entity holds: business numbers, band numbers, census
    codes, open.canada.ca organization codes, LEIs. Each says whether it was verified
    against its issuer's register.
  tags:
  - Entities
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name:
  - entities
  - identifiers
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: release
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - "$ref": "../components/parameters.yaml#/EntityId"
  - name: namespace
    in: query
    required: false
    description: Only identifiers of this namespace, such as ca.cra.bn9.
    schema:
      type: string
    example: ca.statcan.csd_uid
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of identifiers.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Release:
          "$ref": "../components/headers.yaml#/BCRelease"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/IdentifierListResponse.yaml"
          examples:
            identifiers:
              summary: Diamond Valley's identifiers
              value:
                data:
                - namespace: ca.statcan.csd_uid
                  value: '4806014'
                  verified: true
                  vintage: '2021'
                  valid_from:
                  valid_to:
                  provenance:
                    asset: entities/identifiers
                    release: 11
                    recorded_at: '2026-09-27T03:10:44Z'
                    source:
                      origin: roster
                      source_key: buildcanada/jurisdictions
                      capture_sha256: 0d3e12e5a8c8144cbaa4f7358c0ec728d638bd878e79b1586d717a5761b47891
                      row_number: 4412
                    license: OGL-Canada-2.0
                meta:
                  release: 11
                  as_of: '11'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                  limit: 50
                  next_cursor:
                  count:
                links:
                  self: "/v1/entities/01J9ZK4T6M8Q2R5V7X3B1N0C4D/identifiers?as_of=11"
                  next:
    '301':
      "$ref": "../components/problems.yaml#/MovedPermanently"
    '304':
      "$ref": "../components/responses.yaml#/NotModified"
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '404':
      "$ref": "../components/problems.yaml#/NotFound"
