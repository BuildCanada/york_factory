# /entities/{id}/lineage
get:
  operationId: getEntityLineage
  summary: Get an entity's predecessors or successors
  description: |-
    Walks succeeded_by links from the entity: its predecessors (bodies it replaced, such
    as the towns amalgamated into it) or successors, nearest first. Lineage is not payment
    attribution: a predecessor's spending stays on the predecessor, so ask for each
    entity's spending separately.
  tags:
  - Entities
  x-fern-sdk-method-name: lineage
  x-fern-sdk-group-name: entities
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: release
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - "$ref": "../components/parameters.yaml#/EntityId"
  - name: direction
    in: query
    required: false
    description: "`predecessors` (default) or `successors`."
    schema:
      type: string
      enum:
      - predecessors
      - successors
      default: predecessors
    example: predecessors
  - name: max_depth
    in: query
    required: false
    description: How many steps to walk, 1 to 10. Default 10.
    schema:
      type: integer
      minimum: 1
      maximum: 10
      default: 10
    example: 10
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of lineage steps.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Release:
          "$ref": "../components/headers.yaml#/BCRelease"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/LineageResponse.yaml"
