# /entities/{id}/relationships
get:
  operationId: listEntityRelationships
  summary: List an entity's relationships
  description: |-
    Dated, cited relationships in which the entity is the subject (`direction=out`), the
    object (`in`) or either (default): who it reports to, what it governs, where it is
    located, what it is a member of, who owns it. Use /lineage for predecessors and
    successors.
  tags:
  - Entities
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name:
  - entities
  - relationships
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: release
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - "$ref": "../components/parameters.yaml#/EntityId"
  - name: predicate
    in: query
    required: false
    description: Only these predicates, comma-separated.
    schema:
      type: array
      items:
        "$ref": "../components/schemas/Predicate.yaml"
    example:
    - located_within
    style: form
    explode: false
  - name: direction
    in: query
    required: false
    description: "`out` (the entity is the subject), `in` (the object) or `both` (default)."
    schema:
      type: string
      enum:
      - out
      - in
      - both
      default: both
    example: out
  - "$ref": "../components/parameters.yaml#/ValidOn"
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of relationships.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Release:
          "$ref": "../components/headers.yaml#/BCRelease"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
