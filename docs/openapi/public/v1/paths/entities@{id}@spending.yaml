# /entities/{id}/spending
get:
  operationId: listEntitySpending
  summary: List an entity's spending rows
  description: |-
    Spending rows on which the entity is linked in the given role: as recipient (default)
    or payer. Only linked occurrences count; `include_proposed=true` adds rows where a
    rule proposed the link but is not yet active, marked in each party's link_status.
    Unlinked rows with the entity's name are at /spending/unlinked.
  tags:
  - Spending
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name:
  - entities
  - spending
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
    count_exact: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: release
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - "$ref": "../components/parameters.yaml#/EntityId"
  - "$ref": "../components/parameters.yaml#/SpendingRole"
  - name: include_proposed
    in: query
    required: false
    description: Also return rows whose link to the entity is only proposed.
    schema:
      type: boolean
      default: false
    example: false
  - "$ref": "../components/parameters.yaml#/SpendingSource"
  - "$ref": "../components/parameters.yaml#/FiscalYear"
  - name: latest_revision_only
    in: query
    required: false
    description: 'Only rows whose is_latest_revision is true: the highest-ranked revision of each canonical_id, live rows outranking archive_import copies.'
    schema:
      type: boolean
      default: false
    example: true
  - name: sort
    in: query
    required: false
    description: >-
      Sort order: `id` (default, stable), `-amount`, `amount`, `-date` or `date`. Blank amounts and dates
      sort last.
    schema:
      type: string
      enum:
      - id
      - "-amount"
      - amount
      - "-date"
      - date
      default: id
    example: "-amount"
  - name: expand
    in: query
    required: false
    description: Embed `parties` (every occurrence and its link) and `raw` (the original source record).
    schema:
      type: array
      items:
        type: string
        enum:
        - parties
        - raw
    example:
    - parties
    style: form
    explode: false
  - "$ref": "../components/parameters.yaml#/Fields"
  - "$ref": "../components/parameters.yaml#/Count"
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of the entity's spending rows.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Release:
          "$ref": "../components/headers.yaml#/BCRelease"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
