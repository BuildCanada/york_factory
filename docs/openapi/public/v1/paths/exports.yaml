# /exports
get:
  operationId: listExports
  summary: List bulk files
  description: |-
    Parquet files for a release, each with its SHA-256, row count, size and the Iceberg
    table and snapshot it was written from. Phase 1 lists the spending tables; registry
    tables follow in phase 2. Use bulk files for anything that would take more than a few
    thousand calls; they are free and not metered.
  tags:
  - Bulk
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name: exports
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: release
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: release
    in: query
    required: false
    description: 'The release whose files to list. Default: the latest.'
    schema:
      "$ref": "../components/schemas/ReleaseNumber.yaml"
    example: 11
  - name: table
    in: query
    required: false
    description: Only files of this table, such as spending.proactive_grants.
    schema:
      type: string
    example: spending.proactive_grants
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of bulk files.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Release:
          "$ref": "../components/headers.yaml#/BCRelease"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/ExportListResponse.yaml"
          examples:
            release_11:
              summary: Release 11's grants file
              value:
                data:
                - release: 11
                  table: spending.proactive_grants
                  format: parquet
                  url: https://files.buildcanada.com/releases/11/spending.proactive_grants.parquet
                  sha256: 3667aad550e2c7e217f983ab6ae39343a91b24faa32cbc38652f338be372cbf3
                  rows: 1313276
                  bytes: 412883920
                  iceberg:
                    catalog_uri: https://catalog.cloudflarestorage.com/buildcanada/fact-factory
                    namespace: spending
                    table: proactive_grants
                    snapshot_id: '2534519102996296639'
                meta:
                  release: 11
                  as_of: '11'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                  limit: 50
                  next_cursor:
                  count:
                links:
                  self: "/v1/exports?release=11&table=spending.proactive_grants"
                  next:
    '304':
      "$ref": "../components/responses.yaml#/NotModified"
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '404':
      "$ref": "../components/problems.yaml#/NotFound"
    '409':
      "$ref": "../components/problems.yaml#/Conflict"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
