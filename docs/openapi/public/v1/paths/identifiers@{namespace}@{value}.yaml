# /identifiers/{namespace}/{value}
get:
  operationId: resolveIdentifier
  summary: Resolve an identifier to entities
  description: |-
    Finds the entities that hold an external identifier, such as
    /v1/identifiers/ca.cra.bn9/107511586. Spaces are ignored, and a BN15 program account
    given for ca.cra.bn9 is reduced to its BN9. Several entities can hold one identifier
    (an amalgamation's predecessors share its BN); each match has its own validity
    dates. 404 when none does.
  tags:
  - Entities
  x-fern-sdk-method-name: resolve
  x-fern-sdk-group-name: identifiers
  x-bc-phase: 1
  x-bc-units:
    base: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: revision
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: namespace
    in: path
    required: true
    description: >-
      The identifier namespace, such as ca.cra.bn9, ca.isc.band_number, ca.ised.corporation_number or
      gleif.lei.
    schema:
      type: string
      pattern: "^[a-z0-9-]+(\\.[a-z0-9_-]+)+$"
    example: ca.cra.bn9
  - name: value
    in: path
    required: true
    description: The identifier value.
    schema:
      type: string
      minLength: 1
      maxLength: 64
    example: '107511586'
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  responses:
    '200':
      description: The entities holding the identifier.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Revision:
          "$ref": "../components/headers.yaml#/BCRevision"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/IdentifierResolutionResponse.yaml"
          examples:
            bn9:
              summary: A business number
              value:
                data:
                  namespace: ca.cra.bn9
                  value: '107511586'
                  matches:
                  - entity:
                      id: gid://buildcanada/Entity/01JA2B3C4D5E6F7G8H9J0K1M2N
                      name: Diamond Valley Community Foundation
                      entity_class: organization
                      subtype: registered_charity
                      jurisdiction: ca-ab
                      status: active
                    identifier:
                      namespace: ca.cra.bn9
                      value: '107511586'
                      verified: true
                      vintage:
                      valid_from:
                      valid_to:
                      provenance:
                        asset: entities/identifiers
                        revision: 28
                        recorded_at: '2026-09-24T01:12:40Z'
                        source:
                          origin: roster
                          source_key: ca/cra/charities
                          capture_sha256: 444287b8bcd80dfd50a0213f51cb6e69dfd771c73b0eee40e1f01ac836f899b0
                          row_number: 88104
                        license: OGL-Canada-2.0
                meta:
                  revision: 31
                  snapshot:
                  as_of: '31'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                links:
                  self: "/v1/identifiers/ca.cra.bn9/107511586?as_of=31"
    '304':
      "$ref": "../components/responses.yaml#/NotModified"
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '403':
      "$ref": "../components/problems.yaml#/Forbidden"
    '404':
      "$ref": "../components/problems.yaml#/NotFound"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
