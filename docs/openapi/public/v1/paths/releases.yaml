# /releases
get:
  operationId: listReleases
  summary: List releases
  description: |-
    Every published registry release, newest first, with counts. A release is the public
    version unit: pass its number as `as_of` to any operation to get exactly what it
    served. Releases are immutable once published and are served for at least 24 months.
  tags:
  - Releases
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name: releases
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: short
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of releases.
      headers:
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/ReleaseListResponse.yaml"
          examples:
            releases:
              summary: The newest release
              value:
                data:
                - id: gid://buildcanada/Release/11
                  number: 11
                  published_at: '2026-09-27T06:14:02Z'
                  build_versions:
                    registry_build: registry-build-v4
                    resolution: resolution-v5
                    occurrences: occurrences-v3
                    names: names-v2
                    matching: matching-v4
                  inputs: []
                  counts:
                    entities: 184223
                    identifiers: 402118
                    relationships: 96410
                    spending_records: 9841220
                    spending_parties: 12301877
                    linked_parties: 8410022
                  checks: []
                  changes: []
                  links:
                    self: "/v1/releases/11"
                    exports: "/v1/exports?release=11"
                meta:
                  release: 11
                  as_of: '11'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                  limit: 1
                  next_cursor: c1.eyJyIjoxMSwiayI6IjAxSjlaSzRUNk04UTJSNVY3WDNCMU4wQzREIn0.Jq3v
                  count:
                links:
                  self: "/v1/releases?limit=1"
                  next: "/v1/releases?limit=1&cursor=c1.eyJyIjoxMSwiayI6IjAxSjlaSzRUNk04UTJSNVY3WDNCMU4wQzREIn0.Jq3v"
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '409':
      "$ref": "../components/problems.yaml#/Conflict"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
