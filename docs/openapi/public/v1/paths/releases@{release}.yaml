# /releases/{release}
get:
  operationId: getRelease
  summary: Get a release
  description: |-
    One release: when it was published, the roster captures and Iceberg snapshots it
    pinned, its row counts, its blocking checks and its changelog.
  tags:
  - Releases
  x-fern-sdk-method-name: get
  x-fern-sdk-group-name: releases
  x-bc-phase: 1
  x-bc-units:
    base: 1
  x-bc-scopes:
  - read:public
  x-bc-cache: release
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: release
    in: path
    required: true
    description: The release number.
    schema:
      "$ref": "../components/schemas/ReleaseNumber.yaml"
    example: 11
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  responses:
    '200':
      description: The release.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Release:
          "$ref": "../components/headers.yaml#/BCRelease"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/ReleaseResponse.yaml"
          examples:
            release:
              summary: Release 11
              value:
                data:
                  id: gid://buildcanada/Release/11
                  number: 11
                  published_at: '2026-09-27T06:14:02Z'
                  build_versions:
                    registry_build: registry-build-v4
                    resolution: resolution-v5
                    occurrences: occurrences-v3
                    names: names-v2
                    matching: matching-v4
                  inputs:
                  - kind: iceberg_snapshot
                    asset: sources/ca/tbs/proactive_grants
                    sha256:
                    snapshot_id: '2534519102996296639'
                    retrieved_at: '2026-09-26T04:59:12Z'
                  - kind: capture
                    asset: sources/ca-ab/municipal_affairs/municipalities
                    sha256: 388298822179d1c949ea92a24e651d6025055e90a421202f008931b7724167ea
                    snapshot_id:
                    retrieved_at: '2026-09-20T05:02:40Z'
                  counts:
                    entities: 184223
                    identifiers: 402118
                    relationships: 96410
                    spending_records: 9841220
                    spending_parties: 12301877
                    linked_parties: 8410022
                  checks:
                  - name: api_columns_allowlisted
                    blocking: true
                    passed: true
                    detail:
                  - name: api_summary_reconciles
                    blocking: true
                    passed: true
                    detail: 200 of 200 sampled entities reconcile
                  changes:
                  - kind: entities_added
                    summary: 1,204 entities created from unlinked recipients (create-v4).
                    count: 1204
                  links:
                    self: "/v1/releases/11"
                    exports: "/v1/exports?release=11"
                meta:
                  release: 11
                  as_of: '11'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                links:
                  self: "/v1/releases/11"
    '304':
      "$ref": "../components/responses.yaml#/NotModified"
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '403':
      "$ref": "../components/problems.yaml#/Forbidden"
    '404':
      "$ref": "../components/problems.yaml#/NotFound"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
