# /revisions/{revision}
get:
  operationId: getRevision
  summary: Get a revision
  description: |-
    One committed revision: its kind, what it read (roster captures, the spending version of
    each slice it resolved), the rule versions, the snapshots that name it, and the derived
    build at it, if any.
  tags:
  - Revisions
  x-fern-sdk-method-name: get
  x-fern-sdk-group-name: revisions
  x-bc-phase: 1
  x-bc-units:
    base: 1
  x-bc-scopes:
  - read:public
  x-bc-cache: revision
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: revision
    in: path
    required: true
    description: "The revision number."
    schema: {"$ref": "../components/schemas/RevisionNumber.yaml"}
    example: 14
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  responses:
    '200':
      description: Get a revision.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Revision:
          "$ref": "../components/headers.yaml#/BCRevision"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/RevisionResponse.yaml"
          examples:
            release_14:
              summary: Revision 14, the last batch release
              value:
                data:
                  id: gid://buildcanada/Revision/14
                  number: 14
                  kind: release
                  reason: Registry release 14
                  committed_at: '2026-09-30T06:14:02Z'
                  inputs:
                    slices:
                      sources/ca/tbs/proactive_grants: '2534519102996296639'
                  versions: null
                  served: true
                  snapshots:
                  - release-14
                  derived: null
                  links:
                    self: /v1/revisions/14
                meta:
                  revision: 14
                  snapshot: release-14
                  as_of: '14'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                links:
                  self: /v1/revisions/14
    '304':
      "$ref": "../components/responses.yaml#/NotModified"
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '403':
      "$ref": "../components/problems.yaml#/Forbidden"
    '404':
      "$ref": "../components/problems.yaml#/NotFound"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
