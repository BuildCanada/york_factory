# /search
get:
  operationId: searchEntities
  summary: Search entities by name or identifier
  description: |-
    Finds entities by identifier first, then by name. A query that is a BN9, BN15,
    corporation number, band number, LEI or census code matches exactly (match.kind
    identifier). Otherwise names and aliases match after normalization (exact); with
    mode=fuzzy, approximate name matches add candidates (fuzzy), which are guesses to check,
    not matches. Fuzzy matching arrives with PostgreSQL's tin extension on PlanetScale; until
    then mode=fuzzy answers like exact and says so in the fuzzy_unavailable caveat. Phase 1 searches entities only; other types arrive additively.
  tags:
  - Search
  x-fern-sdk-method-name: search
  x-bc-phase: 1
  x-bc-units:
    base: 3
  x-bc-scopes:
  - read:public
  x-bc-cache: revision
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: q
    in: query
    required: true
    description: The name or identifier to find, at least 2 characters.
    schema:
      type: string
      minLength: 2
      maxLength: 200
    example: diamond valley
  - name: types
    in: query
    required: false
    description: Result types, comma-separated. Phase 1 has `entity` only.
    schema:
      type: array
      items:
        type: string
        enum:
        - entity
      default:
      - entity
    example:
    - entity
    style: form
    explode: false
  - name: mode
    in: query
    required: false
    description: "`exact` (default) matches identifiers and normalized names; `fuzzy` adds approximate name candidates (once available; see the operation description)."
    schema:
      type: string
      enum:
      - exact
      - fuzzy
      default: exact
    example: exact
  - name: class
    in: query
    required: false
    description: Only entities of this class.
    schema:
      "$ref": "../components/schemas/EntityClass.yaml"
    example: government_org
  - name: jurisdiction
    in: query
    required: false
    description: Only entities of this jurisdiction.
    schema:
      "$ref": "../components/schemas/Jurisdiction.yaml"
    example: ca-ab
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  - name: limit
    in: query
    required: false
    description: Results per page, 1 to 50. Default 20.
    schema:
      type: integer
      minimum: 1
      maximum: 50
      default: 20
    example: 20
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of results, best first.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Revision:
          "$ref": "../components/headers.yaml#/BCRevision"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/SearchResponse.yaml"
          examples:
            name:
              summary: A name
              value:
                data:
                - type: entity
                  entity:
                    id: gid://buildcanada/Entity/01J9ZK4T6M8Q2R5V7X3B1N0C4D
                    name: Town of Diamond Valley
                    entity_class: government_org
                    subtype: municipal_government
                    jurisdiction: ca-ab
                    status: active
                  match:
                    kind: exact
                    score: 1
                    matched_on: name
                meta:
                  revision: 31
                  snapshot:
                  as_of: '31'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                  limit: 20
                  next_cursor:
                  count:
                links:
                  self: "/v1/search?q=diamond+valley&as_of=31"
                  next:
            identifier:
              summary: A business number
              value:
                data:
                - type: entity
                  entity:
                    id: gid://buildcanada/Entity/01JA2B3C4D5E6F7G8H9J0K1M2N
                    name: Diamond Valley Community Foundation
                    entity_class: organization
                    subtype: registered_charity
                    jurisdiction: ca-ab
                    status: active
                  match:
                    kind: identifier
                    score: 1
                    matched_on: identifier:ca.cra.bn9
                meta:
                  revision: 31
                  snapshot:
                  as_of: '31'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                  limit: 20
                  next_cursor:
                  count:
                links:
                  self: "/v1/search?q=107511586&as_of=31"
                  next:
    '304':
      "$ref": "../components/responses.yaml#/NotModified"
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '403':
      "$ref": "../components/problems.yaml#/Forbidden"
    '404':
      "$ref": "../components/problems.yaml#/NotFound"
    '409':
      "$ref": "../components/problems.yaml#/Conflict"
    '422':
      "$ref": "../components/problems.yaml#/UnprocessableEntity"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
