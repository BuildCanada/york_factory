# /snapshots
get:
  operationId: listSnapshots
  summary: List snapshots
  description: |-
    Named registry revisions, newest first: the revisions people cite and measure against.
    Pass a name as as_of to read the revision it pins.
  tags:
  - Revisions
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name: snapshots
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: short
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: List snapshots.
      headers:
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/SnapshotListResponse.yaml"
          examples:
            snapshots:
              summary: The gold-set snapshot
              value:
                data:
                - name: release-14
                  revision: 14
                  reason: The last batch release, held for the gold set
                  held_by: goldset
                  created_at: '2026-09-30T20:41:07Z'
                  links:
                    self: /v1/snapshots/release-14
                    revision: /v1/revisions/14
                meta:
                  revision: 31
                  snapshot: null
                  as_of: '31'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                  limit: 50
                  next_cursor: null
                  count: null
                links:
                  self: /v1/snapshots
                  next: null
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '403':
      "$ref": "../components/problems.yaml#/Forbidden"
    '409':
      "$ref": "../components/problems.yaml#/Conflict"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
