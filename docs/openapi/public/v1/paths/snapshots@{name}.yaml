# /snapshots/{name}
get:
  operationId: getSnapshot
  summary: Get a snapshot
  description: |-
    One snapshot: the revision it pins, why it was taken, and what holds it through
    retention.
  tags:
  - Revisions
  x-fern-sdk-method-name: get
  x-fern-sdk-group-name: snapshots
  x-bc-phase: 1
  x-bc-units:
    base: 1
  x-bc-scopes:
  - read:public
  x-bc-cache: short
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: name
    in: path
    required: true
    description: "The snapshot's name."
    schema: {"$ref": "../components/schemas/SnapshotName.yaml"}
    example: "release-14"
  responses:
    '200':
      description: Get a snapshot.
      headers:
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/SnapshotResponse.yaml"
          examples:
            release_14:
              summary: release-14
              value:
                data:
                  name: release-14
                  revision: 14
                  reason: The last batch release, held for the gold set
                  held_by: goldset
                  created_at: '2026-09-30T20:41:07Z'
                  links:
                    self: /v1/snapshots/release-14
                    revision: /v1/revisions/14
                meta:
                  revision: 14
                  snapshot: release-14
                  as_of: '14'
                  request_id: req_01JA8X3M2Q9R4T6V8W0Y2Z4B6C
                  caveats: []
                links:
                  self: /v1/snapshots/release-14
    '400':
      "$ref": "../components/problems.yaml#/BadRequest"
    '401':
      "$ref": "../components/problems.yaml#/Unauthorized"
    '403':
      "$ref": "../components/problems.yaml#/Forbidden"
    '404':
      "$ref": "../components/problems.yaml#/NotFound"
    '429':
      "$ref": "../components/problems.yaml#/TooManyRequests"
    '500':
      "$ref": "../components/problems.yaml#/InternalError"
    '503':
      "$ref": "../components/problems.yaml#/ServiceUnavailable"
