# /spending
get:
  operationId: listSpending
  summary: Search spending rows
  description: |-
    Rows of the federal spending sources, filtered by source, linked payer or recipient
    entity, fiscal year, record type, amount and text. Amounts are the source's own
    measure (see /spending/sources): contract values, agreement values, payments or
    commitments. Never add amounts across sources, and never add revisions sharing a
    canonical_id; use /entities/{id}/spending/summary for totals.
  tags:
  - Spending
  x-fern-sdk-method-name: list
  x-fern-sdk-group-name: spending
  x-bc-phase: 1
  x-bc-units:
    base: 1
    large_page: 2
    count_exact: 2
  x-bc-scopes:
  - read:public
  x-bc-cache: release
  x-fern-pagination:
    cursor: "$request.cursor"
    next_cursor: "$response.meta.next_cursor"
    results: "$response.data"
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - "$ref": "../components/parameters.yaml#/SpendingSource"
  - name: payer
    in: query
    required: false
    description: Only rows whose payer occurrence is linked to this entity (ULID or gid).
    schema:
      type: string
      pattern: "^((gid://buildcanada/Entity/)?[0-9A-HJKMNP-TV-Z]{26})$"
    example: 01J9ZK4T6M8Q2R5V7X3B1N0C4D
  - name: recipient
    in: query
    required: false
    description: >-
      Only rows with a recipient-side occurrence (recipient, recipients, research_org, principal_investigator)
      linked to this entity.
    schema:
      type: string
      pattern: "^((gid://buildcanada/Entity/)?[0-9A-HJKMNP-TV-Z]{26})$"
    example: 01J9ZK4T6M8Q2R5V7X3B1N0C4D
  - "$ref": "../components/parameters.yaml#/FiscalYear"
  - name: record_type
    in: query
    required: false
    description: Only rows of this record type.
    schema:
      type: string
      enum:
      - contract
      - grant
      - contribution
      - transfer_payment
      - award
      - project
    example: contribution
  - name: amount_min
    in: query
    required: false
    description: Only rows with amount at least this, as a decimal string. Compares within each row's
      own currency.
    schema:
      "$ref": "../components/schemas/Amount.yaml"
    example: '1000000.00'
  - name: amount_max
    in: query
    required: false
    description: Only rows with amount at most this, as a decimal string.
    schema:
      "$ref": "../components/schemas/Amount.yaml"
    example: '5000000.00'
  - name: q
    in: query
    required: false
    description: Full-text match on title, description, program and party names as published.
    schema:
      type: string
      minLength: 2
      maxLength: 200
    example: cultural spaces
  - name: latest_revision_only
    in: query
    required: false
    description: Only the highest-ranked revision of each canonical_id, as summaries count them.
    schema:
      type: boolean
      default: false
    example: true
  - name: include_aggregated
    in: query
    required: false
    description: Include aggregate rows (is_aggregated). Default true.
    schema:
      type: boolean
      default: true
    example: false
  - name: sort
    in: query
    required: false
    description: >-
      Sort order: `id` (default, stable), `-amount`, `amount`, `-date` or `date`. Blank amounts and dates
      sort last.
    schema:
      type: string
      enum:
      - id
      - "-amount"
      - amount
      - "-date"
      - date
      default: id
    example: "-amount"
  - name: expand
    in: query
    required: false
    description: Embed `parties` (every occurrence and its link) and `raw` (the original source record).
    schema:
      type: array
      items:
        type: string
        enum:
        - parties
        - raw
    example:
    - parties
    style: form
    explode: false
  - "$ref": "../components/parameters.yaml#/Fields"
  - "$ref": "../components/parameters.yaml#/Count"
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  - "$ref": "../components/parameters.yaml#/Limit"
  - "$ref": "../components/parameters.yaml#/Cursor"
  responses:
    '200':
      description: A page of spending rows.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Release:
          "$ref": "../components/headers.yaml#/BCRelease"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/SpendingRecordListResponse.yaml"
          examples:
