# /spending/{id}
get:
  operationId: getSpendingRecord
  summary: Get a spending row
  description: |-
    One spending row with its typed columns, the source's amount rule, every party
    occurrence (and why each is or is not linked), provenance down to the captured file
    and row, and a citation. `expand=raw` adds the original source record.
  tags:
  - Spending
  x-fern-sdk-method-name: get
  x-fern-sdk-group-name: spending
  x-bc-phase: 1
  x-bc-units:
    base: 1
  x-bc-scopes:
  - read:public
  x-bc-cache: release
  security:
  - ApiKey: []
  - OAuth2:
    - read:public
  - {}
  parameters:
  - name: id
    in: path
    required: true
    description: The row's 26-character spending key, or its percent-encoded gid.
    schema:
      type: string
      pattern: "^((gid://buildcanada/SpendingRecord/)?[0-9A-HJKMNP-TV-Z]{26})$"
    example: K3M9Q2W7XA4B8C1D5E6F0G2H3J
  - name: expand
    in: query
    required: false
    description: "`raw` adds the original source record."
    schema:
      type: array
      items:
        type: string
        enum:
        - raw
    example:
    - raw
    style: form
    explode: false
  - "$ref": "../components/parameters.yaml#/AsOf"
  - "$ref": "../components/parameters.yaml#/AcceptLanguage"
  - "$ref": "../components/parameters.yaml#/IfNoneMatch"
  responses:
    '200':
      description: The spending row.
      headers:
        ETag:
          "$ref": "../components/headers.yaml#/ETag"
        Cache-Control:
          "$ref": "../components/headers.yaml#/CacheControl"
        BC-Release:
          "$ref": "../components/headers.yaml#/BCRelease"
        RateLimit:
          "$ref": "../components/headers.yaml#/RateLimit"
        RateLimit-Policy:
          "$ref": "../components/headers.yaml#/RateLimitPolicy"
        BC-Quota-Remaining:
          "$ref": "../components/headers.yaml#/QuotaRemaining"
      content:
        application/json:
          schema:
            "$ref": "../components/schemas/SpendingRecordResponse.yaml"
          examples:
            grant:
              summary: A contribution to Diamond Valley
